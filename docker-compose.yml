version: '3.8'

services:
  api:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Beat scheduler only (single instance; dispatches routed tasks to queues)
  celery_beat:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: celery -A app.core.worker beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
    restart: unless-stopped

  # Master-data lane: infrequent master sync (interval configurable via
  # engine_settings; dispatched by the 5-min router)
  worker_master:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: celery -A app.core.worker worker -Q queue_master --concurrency=4 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
      - BACKFILL_WINDOW_START=19
      - BACKFILL_WINDOW_END=8
      - BACKFILL_START_DATE=2024-01-01
    restart: unless-stopped

  # Daily lane: TRX delta + direct reports (live 30-min delta + deep 06:00) + audit
  worker_trx_daily:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: celery -A app.core.worker worker -Q queue_sync --concurrency=4 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
      - BACKFILL_WINDOW_START=19
      - BACKFILL_WINDOW_END=8
      - BACKFILL_START_DATE=2024-01-01
    restart: unless-stopped

  # Lane A: historical backfill, TRX + RPT (night window 19:00-08:00 WIB; parallel across
  # companies via bf_company_{id} Redis locks - one task per company at a time;
  # dispatch order is CALF-first round-robin)
  worker_backfill:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: celery -A app.core.worker worker -Q queue_backfill --concurrency=6 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
      - BACKFILL_WINDOW_START=19
      - BACKFILL_WINDOW_END=8
      - BACKFILL_START_DATE=2024-01-01
    restart: unless-stopped

  # Report queries + async exports (on-demand, API-facing; parallel XLSX)
  worker_report:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    command: celery -A app.core.worker worker -Q queue_report,queue_export --concurrency=4 --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://187.52.114.14:6379/0
    restart: unless-stopped
