services:
  # Redis - Message Broker & Cache
  # Hardened 2026-09-14: was published on 0.0.0.0:6379 with NO password and
  # answered PING from the public internet. Now bound to host loopback only and
  # protected with --requirepass (set REDIS_PASSWORD in .env); REDIS_URL /
  # CELERY_BROKER_URL / CELERY_RESULT_BACKEND must include the password.
  redis:
    image: redis:7-alpine
    container_name: backend-kopicalf-inhouse-redis-1
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3

  # FastAPI HTTP Server
  api:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-api-1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Beat Scheduler
  # The image ships an HTTP /health healthcheck meant for the API container;
  # beat has no HTTP server, so the inherited check is disabled here.
  celery_beat:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-celery_beat-1
    command: celery -A app.core.worker beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      disable: true

  # Master-data lane: infrequent master sync
  worker_master:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-worker_master-1
    command: celery -A app.core.worker worker -Q queue_master --concurrency=4 --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.worker inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Daily lane: TRX delta + direct reports
  worker_trx_daily:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-worker_trx_daily-1
    command: celery -A app.core.worker worker -Q queue_sync --concurrency=8 --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.worker inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Historical backfill (night window 00:00-08:00 WIB)
  worker_backfill:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-worker_backfill-1
    command: celery -A app.core.worker worker -Q queue_backfill --concurrency=16 --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.worker inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Report queries + async exports
  worker_report:
    image: ${DOCKER_IMAGE:-kopicalf/calf-backend}:${IMAGE_TAG:-latest}
    container_name: backend-kopicalf-inhouse-worker_report-1
    command: celery -A app.core.worker worker -Q queue_report,queue_export --concurrency=8 --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.worker inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
